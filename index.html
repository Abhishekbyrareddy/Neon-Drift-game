<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d1b"><title>Neon Drift • Pocket Arcade</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d1b;color:#eff4ff;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,860px)}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.tag{font-size:11px;letter-spacing:.24em;color:#74eecb;font-weight:700}h1{font-size:clamp(28px,6vw,44px);letter-spacing:-.055em;margin:4px 0}.stats{display:flex;gap:28px;text-align:right}.stats span{display:block;color:#8d9bb7;font-size:10px;letter-spacing:.16em}.stats strong{font-size:24px;font-variant-numeric:tabular-nums}.arena{position:relative;border:1px solid #26334c;border-radius:22px;overflow:hidden;background:#0b1225;box-shadow:0 24px 100px #0006}canvas{display:block;width:100%;height:min(65vh,560px);min-height:320px;touch-action:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#090e1dbd;padding:24px;backdrop-filter:blur(3px)}.overlay[hidden]{display:none}.mark{font-size:44px;color:#75f4d1;text-shadow:0 0 30px #75f4d177}h2{font-size:clamp(28px,5vw,40px);letter-spacing:-.04em;margin:14px 0 8px}.overlay p{max-width:330px;color:#adbad3;line-height:1.65;margin:0 0 24px}button{cursor:pointer;border:0;border-radius:100px;padding:14px 30px;background:#79f4d3;color:#09201c;font:700 14px system-ui}button:hover{background:#aeffe8}button:focus-visible{outline:3px solid #fff;outline-offset:4px}.small{border:1px solid #34405b;background:transparent;color:#becbe2;padding:9px 16px;font-size:12px}.small:hover{background:#1d2942}footer{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#8999b5;font-size:12px;margin-top:16px}kbd{color:#d8e7ff;border:1px solid #33415c;border-radius:4px;padding:2px 5px}#lives{color:#fc91a7;font-size:13px;letter-spacing:3px}.hint{margin-top:22px;font-size:11px;color:#798aa9}@media(max-width:520px){body{padding:14px}.stats{gap:14px}footer{align-items:flex-start}.desktop{display:none}canvas{height:60vh}}
</style></head>
<body><main>
<header><div><div class="tag">POCKET ARCADE / 01</div><h1>Neon Drift<span style="color:#79f4d3">.</span></h1></div><div class="stats"><div><span>SCORE</span><strong id="score">0</strong></div><div><span>BEST</span><strong id="best">0</strong></div></div></header>
<div class="arena"><canvas id="game" aria-label="Neon Drift: steer your ship to avoid pink meteors and collect golden stars"></canvas><div class="overlay" id="overlay"><div class="mark">✦</div><h2 id="title">Find your flow.</h2><p id="message">Dodge the meteors. Catch the stars.<br>How long can you keep drifting?</p><button id="start">Start drifting ↗</button><div class="hint">3 lives · endless space · one more try</div></div></div>
<footer><div><span class="desktop"><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to steer · </span>Drag to steer · Stars +50<br><span id="lives" aria-label="3 lives">♥ ♥ ♥</span></div><button id="pause" class="small" aria-label="Pause game">Pause / P</button></footer>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),livesEl=document.getElementById('lives'),title=document.getElementById('title'),message=document.getElementById('message'),start=document.getElementById('start'),pause=document.getElementById('pause');
let w=800,h=560,state='ready',score=0,best=0,lives=3,time=0,spawn=0,invincible=0,last=0,objects=[],sparks=[],keys={},target=null,dragging=false;
try{best=Math.max(0,Number(localStorage.getItem('neon-drift-best'))||0)}catch{}bestEl.textContent=best;
const ship={x:w/2,y:h-56};const stars=Array.from({length:65},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.4}));
function resize(){const old=w;w=canvas.clientWidth;h=canvas.clientHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ship.x=Math.max(20,Math.min(w-20,ship.x/old*w));ship.y=h-52;target=null}new ResizeObserver(resize).observe(canvas);resize();
function hud(){scoreEl.textContent=Math.floor(score);livesEl.textContent='♥ '.repeat(lives).trim();livesEl.setAttribute('aria-label',lives+' lives')}
function play(){score=0;lives=3;time=0;spawn=0;invincible=0;objects=[];sparks=[];keys={};target=null;ship.x=w/2;state='playing';overlay.hidden=true;pause.textContent='Pause / P';hud()}
function toggle(){if(state==='playing'){state='paused';title.textContent='Take a breather.';message.textContent='Your drift will be right here.';start.textContent='Resume ↗';overlay.hidden=false;pause.textContent='Resume / P'}else if(state==='paused'){state='playing';overlay.hidden=true;pause.textContent='Pause / P'}}
function end(){state='over';const result=Math.floor(score);if(result>best){best=result;try{localStorage.setItem('neon-drift-best',best)}catch{}}bestEl.textContent=best;title.textContent='One more drift?';message.textContent='You scored '+result.toLocaleString()+' points. Your best: '+best.toLocaleString()+'.';start.textContent='Play again ↗';overlay.hidden=false;pause.textContent='Pause / P'}
start.addEventListener('click',()=>state==='paused'?toggle():play());pause.addEventListener('click',toggle);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d',' ','p','escape'].includes(k))e.preventDefault();keys[k]=true;if(!e.repeat){if(k==='p'||k==='escape')toggle();if(k===' '){if(state==='ready'||state==='over')play();else toggle()}}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
addEventListener('blur',()=>{keys={};dragging=false;target=null;if(state==='playing')toggle()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')toggle()});
function aim(e){target=Math.max(18,Math.min(w-18,e.clientX-canvas.getBoundingClientRect().left))}canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;dragging=true;canvas.setPointerCapture(e.pointerId);aim(e)});canvas.addEventListener('pointermove',e=>{if(dragging)aim(e)});for(const type of ['pointerup','pointercancel'])canvas.addEventListener(type,()=>{dragging=false;target=null});
function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*130;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,color})}}
function update(dt){time+=dt;score+=dt*10;invincible=Math.max(0,invincible-dt);let dir=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);if(dir){target=null;ship.x+=dir*400*dt}else if(target!==null)ship.x+=(target-ship.x)*Math.min(1,dt*18);ship.x=Math.max(18,Math.min(w-18,ship.x));spawn-=dt;if(spawn<=0){const collectible=Math.random()<.25;objects.push({x:22+Math.random()*(w-44),y:-25,r:collectible?10:13+Math.random()*10,vy:125+Math.min(time*3,200)+Math.random()*65,star:collectible,angle:Math.random()*6});spawn=Math.max(.22,.65-time*.004)}
for(const o of objects){o.y+=o.vy*dt;o.angle+=dt;if(!o.dead&&Math.hypot(o.x-ship.x,o.y-ship.y)<o.r+11){if(o.star){score+=50;o.dead=true;burst(o.x,o.y,'#ffe29a')}else if(invincible===0){lives--;invincible=1.6;o.dead=true;burst(ship.x,ship.y,'#ff819b');if(lives<=0){hud();end();return}}}}objects=objects.filter(o=>!o.dead&&o.y<h+40);for(const p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}sparks=sparks.filter(p=>p.life>0);hud()}
function draw(){ctx.fillStyle='#0b1225';ctx.fillRect(0,0,w,h);const glow=ctx.createRadialGradient(w*.5,h*.8,0,w*.5,h*.8,w*.7);glow.addColorStop(0,'#152a40');glow.addColorStop(1,'#0b1225');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);for(const s of stars){ctx.fillStyle='#728bb2';ctx.globalAlpha=.3+s.r/4;ctx.fillRect(s.x*w,(s.y*h+time*(12+s.r*10))%h,s.r,s.r)}ctx.globalAlpha=1;ctx.strokeStyle='#ffffff04';for(let x=0;x<w;x+=56){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
for(const o of objects){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.angle);ctx.shadowBlur=18;ctx.shadowColor=o.star?'#ffdc84':'#fa7794';ctx.fillStyle=o.star?'#ffe3a0':'#ed7795';ctx.beginPath();if(o.star){for(let i=0;i<8;i++){const a=i*Math.PI/4,r=i%2?4:12;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}}else{for(let i=0;i<7;i++){const a=i*Math.PI*2/7;ctx.lineTo(Math.cos(a)*o.r,Math.sin(a)*o.r)} }ctx.closePath();ctx.fill();if(!o.star){ctx.fillStyle='#803e63';ctx.beginPath();ctx.arc(-3,-3,o.r*.3,0,Math.PI*2);ctx.fill()}ctx.restore()}
for(const p of sparks){ctx.globalAlpha=p.life/.6;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;
if(invincible>0&&Math.floor(invincible*12)%2===0)return;ctx.save();ctx.translate(ship.x,ship.y);ctx.shadowColor='#6af4d4';ctx.shadowBlur=22;ctx.fillStyle='#78f5d5';ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(15,14);ctx.lineTo(0,8);ctx.lineTo(-15,14);ctx.closePath();ctx.fill();ctx.fillStyle='#f2fffc';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(4,5);ctx.lineTo(-4,5);ctx.fill();ctx.fillStyle='#78f5d580';ctx.beginPath();ctx.moveTo(-5,15);ctx.lineTo(0,25+Math.sin(time*25)*6);ctx.lineTo(5,15);ctx.fill();ctx.restore()}
function frame(now){const dt=Math.min(.04,(now-last)/1000||0);last=now;if(state==='playing')update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
